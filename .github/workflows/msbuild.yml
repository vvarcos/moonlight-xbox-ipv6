---
name: MSBuild

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: .  # Path to the solution file relative to the root of the project.
  BUILD_CONFIGURATION: Release  # Configuration type to build.
  # vcpkg writes every built package here; actions/cache persists it between
  # runs, so ffmpeg/openssl/curl are not recompiled on every build.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write   # needed to publish a release when a tag is pushed
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # Restore the vcpkg binary cache. The key is derived from vcpkg.json (pinned
    # dependency versions) and the overlay ports (ffmpeg patches), so a change
    # there correctly invalidates it. vcpkg itself is content addressed, so even
    # a stale cache is harmless: it just misses and rebuilds what changed.
    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-bincache-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**') }}
        restore-keys: |
          vcpkg-bincache-${{ runner.os }}-

    # NOTE: we intentionally do NOT restore the upstream "vcpkg_installed.zip"
    # anymore. That archive (release 1.10.0) is stale and ships an old ffmpeg,
    # while the app requires ffmpeg 8.1.2 (see Streaming/FFmpegDecoder.cpp).
    # Instead, generate-thirdparty-projects.bat points VCPKG_INSTALLED_DIR at
    # the repo-root vcpkg_installed, so the dependencies are built there at the
    # versions pinned in vcpkg.json and picked up by moonlight-xbox-dx.vcxproj.

    - name: Install VCPKG packages
      run: |
        # vcpkg refuses to start unless the binary cache directory exists,
        # and actions/cache does not create it on a cache miss
        New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Build third party tools
      run: .\generate-thirdparty-projects.bat

    - name: Restore NuGet
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Load Certificate (fork)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      id: cert
      # Generate a throwaway self-signed certificate whenever we build outside the
      # upstream repository. This covers:
      #   - pull requests opened from a fork
      #   - pushes / manual runs on someone's own fork (so a personal fork can
      #     produce an installable package without the upstream signing secret)
      if: >-
        (github.event_name == 'pull_request' &&
         !startsWith(github.event.pull_request.head.repo.full_name, 'TheElixZammuto/')) ||
        (github.event_name != 'pull_request' &&
         !startsWith(github.repository, 'TheElixZammuto/'))
      run: |
        # generate a self signed certificate in pfx format
        
        # https://learn.microsoft.com/en-us/windows/msix/package/create-certificate-package-signing#use-new-selfsignedcertificate-to-create-a-certificate
        # O subject PRECISA ser igual ao Publisher do Package.appxmanifest,
        # senão o empacotamento falha na assinatura.
        $cert = New-SelfSignedCertificate `
          -Type Custom `
          -Subject "CN=MoonlightXbox" `
          -KeyUsage DigitalSignature `
          -FriendlyName "MoonlightUWP" `
          -CertStoreLocation "Cert:\LocalMachine\My" `
          -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

        # Use the GITHUB_TOKEN to create a password for the certificate
        # The token expires when the workflow ends OR after a maximum of 24 hours
        # GITHUB_TOKENS from forks have very limited permissions, which is basically read-only
        $githubToken = $env:GH_TOKEN
        $md5 = New-Object -TypeName System.Security.Cryptography.MD5CryptoServiceProvider
        $hashBytes = $md5.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($githubToken))
        $hash = [System.BitConverter]::ToString($hashBytes).Replace("-", "").ToLower()
        $password = ConvertTo-SecureString -String $hash -Force -AsPlainText

        # export the password for later use, decoded
        $github_output = "password=$hash"
        $github_output | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        # export the thumbprint so MSBuild signs with THIS certificate instead of
        # the hardcoded one in moonlight-xbox-dx.vcxproj (which belongs to upstream)
        "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

        Export-PfxCertificate `
          -Cert Cert:\LocalMachine\My\$($cert.Thumbprint) `
          -FilePath cert.pfx `
          -Password (ConvertTo-SecureString -String $hash -AsPlainText -Force)
        Get-FileHash -Path "cert.pfx"

        # Export the public certificate so it can be trusted on the Xbox
        Export-Certificate -Cert Cert:\LocalMachine\My\$($cert.Thumbprint) -FilePath cert.cer | Out-Null
        Get-FileHash -Path "cert.cer"

        # # Add the certificate to the local machine store
        # $cert_guid = [guid]::NewGuid()
        # netsh http add sslcert `
        #   ipport=0.0.0.0:443 `
        #   certhash=$($cert.Thumbprint.ToString()) `
        #   appid=$($cert_guid.ToString('B'))

    - name: Load Certificate (local)
      if: >-
        (startsWith(github.event.pull_request.head.repo.full_name, 'TheElixZammuto/') &&
            github.event_name == 'pull_request') ||
        (startsWith(github.repository, 'TheElixZammuto/') &&
            github.event_name == 'push')
      env:
        CERTIFICATE_FILE: ${{ secrets.CERTIFICATE_FILE }}
      run: |
        $encodedBytes = [System.Convert]::FromBase64String($env:CERTIFICATE_FILE)
        Set-Content "cert.pfx" -Value $encodedBytes -AsByteStream
        Get-FileHash -Path "cert.pfx"

    - name: Build
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: |
        # get the password from the output if this is a fork
        $certPassword = "${{ steps.cert.outputs.password }}"

        # if certPassword is not empty, use it
        if ($certPassword -ne "") {
          $certPasswordArg = "/p:PackageCertificatePassword=$certPassword"
        }
        else {
          $certPasswordArg = ""
        }

        # the self-signed certificate of a fork has its own thumbprint, which does
        # not match the upstream one hardcoded in moonlight-xbox-dx.vcxproj
        $certThumbprint = "${{ steps.cert.outputs.thumbprint }}"
        if ($certThumbprint -ne "") {
          $certThumbprintArg = "/p:PackageCertificateThumbprint=$certThumbprint"
        }
        else {
          $certThumbprintArg = ""
        }

        msbuild /m `
          /p:Configuration=${{env.BUILD_CONFIGURATION}} `
          /p:AppxBundle=Always `
          /p:AppxPackageDir=output `
          /p:PackageCertificateKeyFile=cert.pfx `
          /p:UapAppxPackageBuildMode=SideLoadOnly `
          $certPasswordArg `
          $certThumbprintArg `
          ${{env.SOLUTION_FILE_PATH}}

    - name: Clean Certificate
      if: always()  # clean up, even if build fails
      run: |
        if(test-path cert.pfx){
          Remove-Item -path cert.pfx
        }
      
    - name: Anexar o certificado ao pacote
      # O certificado só existe em builds de fork (gerado no passo "Load
      # Certificate (fork)"). Ele é publicado junto com o pacote para que possa
      # ser confiado no Windows e no Xbox antes de instalar.
      run: |
        if (Test-Path cert.cer) {
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Copy-Item cert.cer output\cert.cer -Force
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: moonlight-uwp
        path: |
          output

    - name: Publish release
      # Runs only when a tag like v1.0.0 is pushed. Attaches the built package
      # to a GitHub Release so it can be downloaded without logging in.
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        name: Moonlight UWP ${{ github.ref_name }}
        body: |
          Pacote UWP `x64` para **Xbox** (modo de desenvolvedor) e **Windows 10/11**.

          ### O que há de novo em 1.19.1

          - **Exclusão de host instantânea**: remover um host não trava mais a
            interface. O unpair virou "melhor esforço" (3 s para conectar, 5 s no
            total) e roda em segundo plano.
          - **Suporte a IPv6** para hosts remotos (Sunshine com IPv6).
          - **Nova tela inicial** e **novos ícones** do aplicativo.
          - **Comandos do Windows** no menu Select + Start durante o stream.
          - **Identidade própria do pacote** (`MoonlightXbox.MoonlightUWPLocal`),
            então ele convive com a versão da Microsoft Store.

          ### Instalação no Windows

          1. Confie no certificado `cert.cer` (Autoridades de Raiz Confiáveis):

             ```powershell
             Import-Certificate -FilePath .\cert.cer -CertStoreLocation Cert:\LocalMachine\Root
             ```

          2. Instale o `moonlight-xbox-dx_1.19.1.0_x64.msixbundle` com duplo clique
             ou:

             ```powershell
             Add-AppxPackage .\moonlight-xbox-dx_1.19.1.0_x64.msixbundle
             ```

          ### Instalação no Xbox

          1. Ative o **Modo de Desenvolvedor** no console.
          2. Confie no `cert.cer` pelo **Xbox Device Portal** (Certificados).
          3. Envie o `.msixbundle` pelo Device Portal ou instale remotamente.
             Se o console pedir dependências, use os `.appx` da pasta `Dependencies`.

          ### Observações

          - O certificado é gerado a cada build, então o `cert.cer` desta versão é
            diferente do de versões anteriores — confie no certificado da release
            que você for instalar.
          - É necessário ter um host Sunshine (ou GeForce Experience) na rede,
            acessível por IPv4 ou IPv6.
        fail_on_unmatched_files: false
        files: |
          output/**/*.msixbundle
          output/**/*.appx
          output/**/*.cer
